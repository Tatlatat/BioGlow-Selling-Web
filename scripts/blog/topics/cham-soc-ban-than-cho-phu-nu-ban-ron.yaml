title: "Chăm sóc bản thân khi quá bận: 5 dấu hiệu burn-out âm thầm"
keyword: "chăm sóc bản thân phụ nữ bận rộn"
audience: "Phụ nữ 28-45 tuổi đi làm, có gia đình/con nhỏ, sống ở thành phố — đang trong tình trạng quá bận để dành thời gian cho bản thân"
angle: |
  Awareness/đồng cảm thuần — KHÔNG bán hàng, KHÔNG đề cập sản phẩm cụ thể.

  Bài mở đầu bằng câu hỏi hook "Lần cuối bạn làm điều gì CHỈ RIÊNG MÌNH là khi nào?", scene quen thuộc (tan ca → lo cơm → con tắm → đến lúc rảnh thì quá mệt).

  Cấu trúc 4 phần:
  1. Mở bài đồng cảm — không phán xét, không giảng đạo (~150 từ)
  2. 5 dấu hiệu burn-out âm thầm: da xỉn dù skincare đủ, mất hứng thú việc trước đây thích, cáu kỉnh vô cớ với người thân, ngủ 7-8 tiếng vẫn mệt, không nhớ nổi sở thích của mình (~500 từ)
  3. Tại sao self-care KHÔNG phải ích kỷ — phân biệt ích kỷ vs tự chăm sóc, ẩn dụ mặt nạ oxy trên máy bay (~400 từ)
  4. 3 bước nhỏ — chọn 1, làm 7 ngày liền: 5 phút skincare tối (rửa mặt + dưỡng ẩm), 10 phút đọc/nghe gì đó cho mình, 15 phút đi bộ ngoài trời không nghe podcast công việc (~400 từ)

  Đóng bài (~50 từ): "Dành 1 emoji cho bản thân hôm nay. Bạn xứng đáng được chăm sóc." + soft Zalo invite kiểu "Nếu bạn muốn chia sẻ cảm nhận hoặc cần ai đó lắng nghe, BioGlowVN luôn ở đây — nhắn Zalo bất cứ lúc nào, không cần phải mua gì."

  Tone: đồng cảm, ấm áp, không phán xét, không giảng đạo, không ép action, không bán hàng.
